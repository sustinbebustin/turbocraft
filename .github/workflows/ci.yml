name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".changeset/**"

permissions: {}

# PR runs: cancel previous attempt for the same branch (latest commit wins).
# Push runs: key on SHA so each main-push verifies to completion -- a faster
# follow-up shouldn't cancel a slower predecessor.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.ref_name) || format('{0}-sha-{1}', github.workflow, github.sha) }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-monorepo

      - run: pnpm lint

      - run: pnpm format

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
