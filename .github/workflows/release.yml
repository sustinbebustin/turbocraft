name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # changesets pushes tags + creates GitHub releases
      contents: write
      # changesets opens the "Version Packages" PR
      pull-requests: write
      # required for npm OIDC trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # changesets diffs against tags to find pending releases
          fetch-depth: 0

      # pnpm version comes from `packageManager` in root package.json
      # (pnpm@10.33.0). Don't pin `version:` here — action-setup@v6 errors
      # on conflict with `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships with npm >=11.x, which trusted publishing requires.
          # Engines floor (>=22.12) is unaffected — that controls end-users.
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
          # NOTE: no `NODE_AUTH_TOKEN` / `always-auth` — OIDC handles auth.

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Create release PR or publish
        uses: changesets/action@v1.8.0
        with:
          # `pnpm release` = turbo build (filtered) && changeset publish.
          # changesets autodetects pnpm and runs `pnpm publish` per package,
          # which rewrites `workspace:*` and `catalog:` to concrete versions.
          publish: pnpm release
          version: pnpm version
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth is via npm OIDC trusted publisher (no NPM_TOKEN).
          # Provenance is auto under trusted publishing; setting this
          # explicitly is harmless and guards the silent-fallback edge case.
          NPM_CONFIG_PROVENANCE: "true"
