name: Release

on:
  push:
    branches:
      - main

permissions: {}

# Releases must serialize -- the version PR is created/updated against latest main.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # changesets pushes tags + creates GitHub releases
      contents: write
      # changesets opens the "Version Packages" PR
      pull-requests: write
      # required for npm OIDC trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # changesets diffs against tags to find pending releases
          fetch-depth: 0
          # changesets/action authenticates via GITHUB_TOKEN env, not the
          # stored git credential -- safe to drop the credential here.
          persist-credentials: false

      - uses: ./.github/actions/setup-monorepo
        with:
          # Node 24 ships npm >=11.x, required for npm OIDC trusted publishing.
          # Engines floor (>=22.12) is unaffected -- that controls end-users.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # NOTE: no `NODE_AUTH_TOKEN` / `always-auth` -- OIDC handles auth.

      - name: Create release PR or publish
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          # `pnpm release` = turbo build (filtered) && changeset publish.
          # changesets autodetects pnpm and runs `pnpm publish` per package,
          # which rewrites `workspace:*` and `catalog:` to concrete versions.
          # `pnpm run` is required for `version`: bare `pnpm version` resolves
          # to pnpm's built-in (prints Node versions), not our package.json
          # script. `release` doesn't collide so the bare form is fine there.
          publish: pnpm release
          version: pnpm run version
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth is via npm OIDC trusted publisher (no NPM_TOKEN).
          # Provenance is auto under trusted publishing; setting this
          # explicitly is harmless and guards the silent-fallback edge case.
          NPM_CONFIG_PROVENANCE: "true"
