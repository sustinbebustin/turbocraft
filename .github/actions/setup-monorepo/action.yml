name: Setup monorepo
description: pnpm + Node + frozen-lockfile install. Caller must run actions/checkout first.

inputs:
  node-version:
    description: Node major or full semver. Defaults to engines floor.
    required: false
    default: "22"
  registry-url:
    description: Optional npm registry URL (set for release workflows).
    required: false
    default: ""
  install:
    description: Whether to run `pnpm install --frozen-lockfile`.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # pnpm version comes from `packageManager` in root package.json.
    # Don't pass `version:` -- action-setup errors on conflict.
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
